# SIGNAL — quiet by default; colour only where something needs attention.
#
# Design rules, so future edits stay consistent:
#   * The bar shows only things that CHANGE. Hostname and both IPs moved to
#     "prefix + i" -- they cost 53 columns and never told you anything new.
#   * A segment that has nothing to say prints nothing at all, separator
#     included. No empty "│   │" slots.
#   * Three colours total. Neutral is the default; the accent marks "you are
#     here"; warn marks "look at this". Nothing is coloured merely to show
#     that it is a different field -- spacing already does that.
#
#   accent  #5fafff   session pill, current window, clock
#   neutral #7f7f7f   everything at rest
#   text    #b2b2b2   readable neutral (branch name)
#   warn    #ffaf00   zoomed pane, unread activity, dirty repo, battery <= 20%
#   prefix  #ff5f00   prefix key is armed
source-file ~/tmux_themes/themes/_common.tmux

# Pane bg / borders
# Not pure black: a lifted charcoal, the ground code editors actually use.
# The focused pane sits one step brighter than the others.
set -g window-style 'bg=#0b0e12'
set -g window-active-style 'bg=#0f1319'
set -g pane-border-style 'fg=#303030'
set -g pane-active-border-style 'fg=#5fafff'
set -g message-style 'bg=#5fafff,fg=#000000'

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 10
set -g status-style "bg=#000000,fg=#b2b2b2"

# Left: prefix dot, then the session pill.
set -g status-left "#{?client_prefix,#[fg=#ff5f00]●,#[fg=#3a3a3a]●} #[fg=#000000,bg=#5fafff,bold] #S #[fg=#5fafff,bg=#000000] "

# Windows. Z = this window has a zoomed pane, ! = activity while you were away.
setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#7f7f7f] #I #W#{?window_zoomed_flag,#[fg=#ffaf00]Z,}#{?window_activity_flag,#[fg=#ffaf00]!,} "
setw -g window-status-current-format "#[fg=#5fafff,bold] #I #W#{?window_zoomed_flag,#[fg=#ffaf00]Z,} "

# Claude Code renames its own process to a bare version number ("2.1.259"), so
# every Claude window ends up with the same meaningless name. Show the folder
# it is working in instead.
setw -g automatic-rename-format "#{?pane_in_mode,[copy],#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude:#{b:pane_current_path},#{pane_current_command}}}#{?pane_dead,[dead],}"

# Right: only what changes. Each helper prints its own trailing spacing, or
# nothing at all when it has nothing to report.
set -g status-right "\
#(~/tmux_themes/helpers/seg-git.sh #{pane_current_path})\
#(~/tmux_themes/helpers/seg-battery.sh)\
#(~/tmux_themes/helpers/seg-weather.sh)\
#[fg=#5fafff,bold]%H:%M  \
#[fg=#7f7f7f]#(~/tmux_themes/helpers/seg-date.sh)"

# prefix + i -- hostname, LAN IP, WAN IP, uptime, load. On demand, not always.
bind i display-popup -w 44 -h 11 -E "~/tmux_themes/helpers/sysinfo.sh"
